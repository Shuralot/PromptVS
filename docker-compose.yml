services:
  app:
    image: promptvs-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
    container_name: PromptVS
    restart: always
    expose:
      - "3000"
    ports:
      - "${APP_PORT}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=${NODE_ENV}
      - SOCKET_SERVER_URL=http://socket-server:4000
    depends_on:
      - db
      - socket-server
    networks:
      - app_network

  socket-server:
    image: promptvs-socket:latest
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    container_name: socket_server
    restart: always
    ports:
      - "4000:4000"
    networks:
      - app_network

  db:
    image: postgres:15-alpine
    container_name: PromptVS_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Em VPS, evite expor a porta do banco para a internet a menos que necessário e protegido por firewall.
    # Se precisar acessar externamente, descomente a linha abaixo e configure DB_PORT no .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

volumes:
  postgres_data:


networks:
  app_network:
    driver: bridge
